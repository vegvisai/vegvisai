name: Find help (for businesses)
description: Ask a developer for help with your AI business card, the AI check or registration. Helpers answer here; any deal and payment is between you and them.
title: "Find help: "
labels: ["find help"]
body:
  - type: markdown
    attributes:
      value: |
        For businesses that want help with their own business (not private persons). Describe what you need; developers and agencies from the [helper list](../tree/main/helpers) and the community can answer.
        **VegvisAI takes no cut, handles no payment and guarantees no work.** Any deal is between you and the helper; the helper list is not a certification, so check references and agree terms in writing. Using a helper gives no advantage in the guide: the same rules apply whether you do it yourself or pay someone.
        **Safety:** never post or send passwords. Give a helper their own login with limited access, and remove it when the job is done. An answer in this thread is not an approval by VegvisAI.
        This issue is public and stays on GitHub. Do not post personal data or prices you do not want public; swap contact details privately. Report fraud privately to contact@vegvis.ai. See the [privacy notice](https://vegvis.ai/privacy/).
  - type: input
    id: website
    attributes:
      label: Your website
      placeholder: https://www.example-bakery.no
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Country and language
      placeholder: Norway, Norwegian
    validations:
      required: true
  - type: dropdown
    id: need
    attributes:
      label: What do you need help with?
      multiple: true
      options:
        - Making the AI business card
        - Putting the files on my website
        - Fixing what the AI check found
        - Registering in the guide
        - Something else
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Your website builder (WordPress, Wix, Shopify …), what you have tried, your AI check score, and whether you want free help or are willing to pay.
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Terms
      options:
        - label: I ask on behalf of a business, I understand that VegvisAI is not part of any deal, and that a helper gives no advantage in the guide.
          required: true
