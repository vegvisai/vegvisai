# Mirrors the signed monthly releases of the open index (ODbL) from the platform.
# Every release is checked against index/signing-key.json before it is committed.
name: Index release
on:
  schedule:
    - cron: "0 6 1 * *"   # the platform makes the release at 03:00 UTC on the 1st
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLATFORM: ${{ vars.VEGVIS_PLATFORM || 'https://veiviser-test.testplattform.workers.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/bots/fetch-releases.mjs
      - name: Commit new releases
        run: |
          git add releases/
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git config user.name "vegvisai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Index release $(basename "$(ls releases/businesses/*.json | tail -1)" .json)"
          git push
