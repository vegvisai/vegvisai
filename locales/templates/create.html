<!doctype html>
<html lang="{{_meta.html_lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- Generated by locales/build_locales.py from locales/templates/create.html. Do not edit. -->
<title>{{t.title}}</title>
<meta name="description" content="{{attr:t.description}}">
{{alternates}}
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebApplication","name":"{{json:t.appName}}","applicationCategory":"DeveloperApplication","inLanguage":"{{_meta.html_lang}}","isAccessibleForFree":true,"offers":{"@type":"Offer","price":"0","priceCurrency":"EUR"}}
</script>
<style>:root{--bg:#fbfaf7;--fg:#1d1d1b;--mut:#5b5b57;--acc:#0b6e4f;--box:#f0eee7;--adv:#a8321e}@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mut:#a9a8a1;--acc:#5fd0a5;--box:#23231f;--adv:#ff8a73}}body{background:var(--bg);color:var(--fg);font:17px/1.55 system-ui,sans-serif;margin:0}main{max-width:44rem;margin:0 auto;padding:2rem 1rem 4rem}a{color:var(--acc)}h1{font-size:2rem;line-height:1.2}.mut{color:var(--mut)}.boks{background:var(--box);padding:1rem 1.25rem;border-radius:8px}.test{border:1px dashed var(--mut);padding:.5rem .75rem;border-radius:6px;font-size:.9rem}code{background:var(--box);padding:.1em .3em;border-radius:4px}
fieldset{border:1px solid var(--box);border-radius:8px;margin:0 0 1.25rem;padding:.75rem 1rem 1rem}legend{font-weight:600;padding:0 .3rem}label{display:block;margin:.6rem 0 .2rem}.hjelp{font-size:.85rem;color:var(--mut);margin:.1rem 0 0}
input,select,textarea{font:inherit;width:100%;box-sizing:border-box;padding:.45rem .6rem;border:1px solid var(--mut);border-radius:6px;background:var(--bg);color:var(--fg)}textarea{min-height:5.5rem;resize:vertical}input[type=checkbox],input[type=radio]{width:auto;margin-right:.35rem}
.rad{display:flex;gap:.5rem;flex-wrap:wrap;align-items:end}.rad>*{flex:1 1 8rem}.dager{display:flex;flex-wrap:wrap;gap:.25rem 1rem}.dager label{display:inline-flex;align-items:center;margin:0}
button{font:inherit;padding:.5rem 1rem;border:0;border-radius:6px;background:var(--acc);color:var(--bg);cursor:pointer}button.sek{background:var(--box);color:var(--fg)}
.adv{border-left:4px solid var(--adv);padding:.5rem 1rem;background:var(--box);border-radius:0 8px 8px 0}.adv strong{color:var(--adv)}
.fil{margin:1rem 0}.fil textarea{font:13px/1.45 ui-monospace,monospace;min-height:12rem;white-space:pre}.fil .knapper{display:flex;gap:.5rem;margin-top:.4rem}</style>
</head>
<body>
<main>
<p class="test">{{t.test}}{{languages}}</p>
<h1>{{t.h1}}</h1>
<p>{{t.intro}}</p>
<p><button type="button" class="sek" id="example">{{t.exampleButton}}</button></p>

<form id="form" novalidate>
<fieldset>
<legend>{{t.basics}}</legend>
<label for="country">{{t.country}}</label>
<select id="country" name="country">
{{option:NO}}
{{option:GB}}
<optgroup label="{{attr:t.euGroup}}">
{{euOptions}}
</optgroup>
<option value="OTHER">{{t.otherOption}}</option>
</select>
<input id="otherCountry" maxlength="2" placeholder="{{attr:t.otherPlaceholder}}" hidden>
<div id="noBox"><label for="orgNumber">{{t.orgNumber}}</label>
<div class="rad"><input id="orgNumber" name="orgNumber" inputmode="numeric" maxlength="11" autocomplete="off"><button type="button" class="sek" id="lookup" style="flex:0 0 auto">{{t.lookup}}</button></div>
<p class="hjelp" id="lookupStatus">{{t.lookupHelp}}</p></div>
<div id="ukBox" hidden><label for="companyNumber">{{t.companyNumber}}</label>
<input id="companyNumber" name="companyNumber" maxlength="10" autocomplete="off" placeholder="{{attr:t.companyNumberPlaceholder}}">
<p class="hjelp">{{t.companyNumberHelp}}</p></div>
<div id="vatBox" hidden><label for="vatId">{{t.vatId}}</label>
<input id="vatId" name="vatId" maxlength="16" autocomplete="off" placeholder="{{attr:t.vatIdPlaceholder}}">
<p class="hjelp">{{t.vatIdHelp}}</p></div>
<label for="name">{{t.name}}</label>
<input id="name" name="name" maxlength="120" required>
<label for="type">{{t.type}}</label>
<select id="type" name="type"></select>
<label for="website">{{t.website}}</label>
<input id="website" name="website" inputmode="url" placeholder="{{attr:t.websitePlaceholder}}" maxlength="300">
<label for="summary">{{t.summary}}</label>
<input id="summary" name="summary" maxlength="300">
<p class="hjelp">{{t.summaryHelp}}</p>
</fieldset>

<fieldset>
<legend>{{t.offer}}</legend>
<label for="services">{{t.services}}</label>
<textarea id="services" name="services"></textarea>
<label for="notOffered">{{t.notOffered}}</label>
<textarea id="notOffered" name="notOffered"></textarea>
<p class="hjelp">{{t.notOfferedHelp}}</p>
<label for="prices">{{t.prices}}</label>
<textarea id="prices" name="prices" placeholder="{{attr:t.pricesPlaceholder}}"></textarea>
<div class="rad">
<div><label for="currency">{{t.currency}}</label><select id="currency" name="currency"><option>EUR</option><option>NOK</option><option>GBP</option><option>SEK</option><option>DKK</option><option>PLN</option><option>CZK</option><option>HUF</option><option>RON</option><option>BGN</option><option>CHF</option><option>USD</option></select></div>
<div><label for="offerType">{{t.offerType}}</label><select id="offerType" name="offerType"><option value="Product">{{t.goods}}</option><option value="Service">{{t.servicesOption}}</option></select></div>
<div><label for="availability">{{t.availability}}</label><select id="availability" name="availability"><option value="InStock">{{t.inStock}}</option><option value="PreOrder">{{t.preOrder}}</option></select></div>
</div>
</fieldset>

<fieldset>
<legend>{{t.whereWhen}}</legend>
<label for="street">{{t.street}}</label>
<input id="street" name="street" maxlength="120" autocomplete="street-address">
<div class="rad">
<div><label for="postalCode">{{t.postalCode}}</label><input id="postalCode" name="postalCode" maxlength="12" autocomplete="postal-code"></div>
<div><label for="city">{{t.city}}</label><input id="city" name="city" maxlength="60"></div>
</div>
<input type="hidden" id="municipalityNumber" name="municipalityNumber">
<label for="areas">{{t.areas}}</label>
<input id="areas" name="areas" placeholder="{{attr:t.areasPlaceholder}}">
<label><input type="checkbox" id="homeVisits" name="homeVisits">{{t.homeVisits}}</label>
<label>{{t.days}}</label>
<div class="dager" id="days"></div>
<div class="rad">
<div><label for="opens">{{t.opens}}</label><input id="opens" name="opens" type="time"></div>
<div><label for="closes">{{t.closes}}</label><input id="closes" name="closes" type="time"></div>
</div>
<label for="hoursNote">{{t.hoursNote}}</label>
<input id="hoursNote" name="hoursNote" placeholder="{{attr:t.hoursNotePlaceholder}}" maxlength="160">
<label for="languages">{{t.languages}}</label>
<input id="languages" name="languages" value="{{serveLanguages}}">
</fieldset>

<fieldset>
<legend>{{t.requests}}</legend>
<div class="rad">
<div><label for="phone">{{t.phone}}</label><input id="phone" name="phone" inputmode="tel" autocomplete="tel"></div>
<div><label for="email">{{t.email}}</label><input id="email" name="email" type="email" autocomplete="email"></div>
</div>
<label for="contactPage">{{t.contactPage}}</label>
<input id="contactPage" name="contactPage" inputmode="url">
<label for="requestInfo">{{t.requestInfo}}</label>
<textarea id="requestInfo" name="requestInfo" placeholder="{{attr:t.requestInfoPlaceholder}}"></textarea>
<p class="hjelp">{{t.requiredHelp}}</p>
</fieldset>

<button>{{t.button}}</button>
</form>

<div id="output" aria-live="polite"></div>
<p><a href="/">{{t.linkHome}}</a> · <a href="{{path:check}}">{{t.linkCheck}}</a> · <a href="{{path:register}}">{{t.linkRegister}}</a></p>

<script type="application/json" id="tekster">{{texts}}</script>
<script type="module">
// Business card generator in the page's language; the texts come from locales/.
import { typesFor, makeFiles } from "/felles/visittkort.js";

const P = JSON.parse(document.getElementById("tekster").textContent), LANG = "{{_meta.code}}";
const fill = (s, v) => String(s).replace(/\{(\w+)\}/g, (m, k) => (k in v ? String(v[k]) : m));
const $ = (id) => document.getElementById(id);
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; };
const label = (key) => P.labels[key] ?? key;
const EU = new Set(["AT","BE","BG","CY","CZ","DE","DK","EE","GR","ES","FI","FR","HR","HU","IE","IT","LT","LU","LV","MT","NL","PL","PT","RO","SE","SI","SK"]);
const CURRENCY = { GB: "GBP", NO: "NOK", SE: "SEK", DK: "DKK", PL: "PLN", CZ: "CZK", HU: "HUF", RO: "RON", BG: "BGN" };
const country = () => ($("country").value === "OTHER" ? $("otherCountry").value.trim().toUpperCase() : $("country").value);
function showCountry() {
  const c = country();
  $("otherCountry").hidden = $("country").value !== "OTHER";
  $("ukBox").hidden = c !== "GB";
  $("vatBox").hidden = !EU.has(c);
  $("noBox").hidden = c !== "NO";
  $("currency").value = CURRENCY[c] ?? (EU.has(c) ? "EUR" : "USD");
}
$("country").addEventListener("change", showCountry);
$("otherCountry").addEventListener("input", showCountry);

for (const [k, v] of Object.entries(typesFor(LANG))) $("type").append(new Option(v, k));
for (const [k, v] of Object.entries(P.dayShort)) {
  const l = el("label");
  const c = Object.assign(document.createElement("input"), { type: "checkbox", name: "days", value: k });
  l.append(c, v);
  $("days").append(l);
}
$("offerType").addEventListener("change", () => { $("availability").disabled = $("offerType").value !== "Product"; });

function readForm() {
  const f = Object.fromEntries(new FormData($("form")));
  f.days = [...document.querySelectorAll("input[name=days]:checked")].map((c) => c.value);
  f.homeVisits = $("homeVisits").checked;
  f.country = country();
  f.text = LANG;
  return f;
}

$("lookup").addEventListener("click", async () => {
  const status = $("lookupStatus");
  status.textContent = P.lookupBusy;
  try {
    const r = await fetch("/api/enhet?lang=" + LANG + "&orgnr=" + encodeURIComponent($("orgNumber").value));
    const e = await r.json();
    if (!r.ok) throw new Error(e.error);
    if (e.bankrupt || e.under_liquidation) throw new Error(P.lookupBankrupt);
    $("orgNumber").value = e.org_number;
    $("name").value = e.name;
    $("street").value = e.address;
    $("postalCode").value = e.postal_code;
    $("city").value = e.city;
    $("municipalityNumber").value = e.municipality_number;
    if (e.website && !$("website").value) $("website").value = e.website;
    status.textContent = fill(P.lookupDone, { name: e.name + (e.industry ? ` (${e.industry})` : ""), source: e.source });
  } catch (err) {
    status.textContent = err.message || P.lookupFailed;
  }
});

$("example").addEventListener("click", () => {
  const { country: c, days, ...v } = P._example;
  $("country").value = c; showCountry();
  for (const [k, x] of Object.entries(v)) if ($(k)) $(k).value = x;
  $("homeVisits").checked = false;
  const open = new Set(days.split(","));
  for (const box of document.querySelectorAll("input[name=days]")) box.checked = open.has(box.value);
  $("availability").disabled = $("offerType").value !== "Product";
});

$("form").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const r = makeFiles(readForm(), { lang: LANG });
  const output = $("output");
  output.replaceChildren();
  if (r.missing.length) {
    output.append(el("p", fill(P.missing, { fields: r.missing.map(label).join(", ") }), "adv"));
    output.scrollIntoView({ behavior: "smooth" });
    return;
  }
  if (r.warnings.length) {
    const warn = el("div", undefined, "adv");
    warn.append(el("strong", P.warnTitle), el("p", P.warnText));
    const ul = el("ul");
    for (const w of r.warnings) ul.append(el("li", `${label(w.field)}: ${w.text}${w.excerpt ? ` («${w.excerpt}»)` : ""}`));
    warn.append(ul);
    output.append(warn);
  }
  output.append(el("h2", P.filesH2));
  output.append(el("p", fill(P.filesText, { website: r.data.website }), "mut"));
  for (const [name, content] of Object.entries(r.files)) {
    const box = el("div", undefined, "fil");
    const ta = el("textarea");
    ta.readOnly = true;
    ta.value = content;
    ta.setAttribute("aria-label", name);
    const copy = el("button", P.copy, "sek");
    copy.type = "button";
    copy.onclick = async () => { await navigator.clipboard.writeText(content); copy.textContent = P.copied; };
    const download = el("button", P.download, "sek");
    download.type = "button";
    download.onclick = () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([content], { type: name.endsWith(".json") ? "application/json" : name.endsWith(".html") ? "text/html" : "text/plain" }));
      a.download = name.split("/").pop();
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
    const buttons = el("div", undefined, "knapper");
    buttons.append(copy, download);
    box.append(el("h3", name), ta, buttons);
    output.append(box);
  }
  output.scrollIntoView({ behavior: "smooth" });
});
showCountry();
</script>
</main>
</body>
</html>
