<!doctype html>
<html lang="{{_meta.html_lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- Generated by locales/build_locales.py from locales/templates/register.html. Do not edit. -->
<title>{{t.title}}</title>
<meta name="description" content="{{attr:t.description}}">
{{alternates}}
<style>:root{--bg:#fbfaf7;--fg:#1d1d1b;--mut:#5b5b57;--acc:#0b6e4f;--box:#f0eee7;--adv:#a8321e;--ok:#0b6e4f}@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mut:#a9a8a1;--acc:#5fd0a5;--box:#23231f;--adv:#ff8a73;--ok:#5fd0a5}}body{background:var(--bg);color:var(--fg);font:17px/1.55 system-ui,sans-serif;margin:0}main{max-width:44rem;margin:0 auto;padding:2rem 1rem 4rem}a{color:var(--acc)}h1{font-size:2rem;line-height:1.2}.mut{color:var(--mut)}.boks{background:var(--box);padding:1rem 1.25rem;border-radius:8px}.test{border:1px dashed var(--mut);padding:.5rem .75rem;border-radius:6px;font-size:.9rem}code{background:var(--box);padding:.1em .3em;border-radius:4px}
label{display:block;margin:.8rem 0 .2rem}select{font:inherit;width:100%;box-sizing:border-box;padding:.45rem .6rem;border:1px solid var(--mut);border-radius:6px;background:var(--bg);color:var(--fg)}#annet{margin-top:.4rem}input{font:inherit;width:100%;box-sizing:border-box;padding:.45rem .6rem;border:1px solid var(--mut);border-radius:6px;background:var(--bg);color:var(--fg)}input[type=checkbox]{width:auto;margin-right:.4rem}.samtykke{display:flex;align-items:flex-start;gap:.2rem;margin:1rem 0}.samtykke label{margin:0}
button{font:inherit;padding:.55rem 1.1rem;border:0;border-radius:6px;background:var(--acc);color:var(--bg);cursor:pointer;margin-top:.5rem}button:disabled{opacity:.6;cursor:wait}
.adv{border-left:4px solid var(--adv);padding:.5rem 1rem;background:var(--box);border-radius:0 8px 8px 0}.ok{border-left:4px solid var(--ok);padding:.5rem 1rem;background:var(--box);border-radius:0 8px 8px 0}</style>
</head>
<body>
<main>
<p class="test">{{t.test}}{{languages}}</p>
<h1>{{t.h1}}</h1>
<p>{{t.intro}}</p>
<p class="mut">{{t.noCard}}</p>

<form id="skjema">
<label for="land">{{t.country}}</label>
<select id="land">
{{option:NO}}
<optgroup label="{{attr:t.euGroup}}">
{{euOptions}}
</optgroup>
<option value="GB"{{selected:GB}}>{{gbOption}}</option>
<option value="OTHER">{{t.otherOption}}</option>
</select>
<input id="annet" type="text" maxlength="2" placeholder="{{attr:t.otherPlaceholder}}" hidden>
<label for="url">{{t.url}}</label>
<input id="url" type="text" inputmode="url" autocomplete="url" spellcheck="false" placeholder="{{attr:t.urlPlaceholder}}" required>
<label for="orgnr" id="orgnr-label">{{t.labelNO}}</label>
<input id="orgnr" type="text" placeholder="{{attr:t.placeholderNO}}">
<div class="samtykke">
<input id="samtykke" type="checkbox" required>
<label for="samtykke">{{t.consent}}</label>
</div>
<button id="knapp">{{t.button}}</button>
</form>
<p id="status" class="mut" aria-live="polite"></p>
<div id="resultat"></div>

<h2>{{t.whatH2}}</h2>
<ol>
<li>{{t.step1}}</li>
<li>{{t.step2}}</li>
<li>{{t.step3}}</li>
<li>{{t.step4}}</li>
<li>{{t.step5}}</li>
</ol>
<p class="mut">{{t.privacy}}</p>

<h2>{{t.statusH2}}</h2>
<form id="statusskjema">
<label for="orgnr2">{{t.statusLabel}}</label>
<input id="orgnr2" type="text" required>
<button>{{t.statusButton}}</button>
</form>
<p id="statussvar" aria-live="polite"></p>
<p><a href="/">{{t.linkHome}}</a></p>

<script type="application/json" id="tekster">{{texts}}</script>
<script>
// Registration form in the page's language; the texts come from locales/.
const P = JSON.parse(document.getElementById("tekster").textContent), LANG = "{{_meta.code}}";
const $ = (id) => document.getElementById(id);
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; };
const land = () => ($("land").value === "OTHER" ? $("annet").value.trim().toUpperCase() : $("land").value);
function showCountry() {
  const v = $("land").value;
  $("annet").hidden = v !== "OTHER";
  $("orgnr-label").textContent = v === "NO" ? P.labelNO : v === "OTHER" ? P.labelOther : v === "GB" ? P.labelGB : P.labelEU;
  $("orgnr").placeholder = v === "NO" ? P.placeholderNO : v === "OTHER" ? "" : P.placeholderEU;
  $("orgnr").disabled = v === "OTHER";
}
$("land").addEventListener("change", showCountry);
showCountry();

$("skjema").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("knapp").disabled = true;
  $("resultat").replaceChildren();
  $("status").textContent = P.sending;
  try {
    const res = await fetch("/api/meld-inn", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: $("url").value.trim(), country: land(), orgnr: $("orgnr").value, consent: $("samtykke").checked, lang: LANG }) });
    const r = await res.json();
    if (!res.ok) throw new Error(r.error || P.failed);
    const box = el("div", undefined, r.status === "rejected" ? "adv" : "ok");
    box.append(el("strong", P.status[r.status] || r.status));
    if (r.reasons.length) { const ul = el("ul"); for (const x of r.reasons) ul.append(el("li", x.text)); box.append(ul); }
    if (r.entry) box.append(el("p", `${r.entry.name} · ${r.entry.domain} · ${r.entry.org_number}`, "mut"));
    $("resultat").append(box);
    $("status").textContent = "";
  } catch (e) {
    $("status").textContent = e.message;
  } finally {
    $("knapp").disabled = false;
  }
});

$("statusskjema").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const res = await fetch("/api/status?lang=" + LANG + "&orgnr=" + encodeURIComponent($("orgnr2").value));
  const r = await res.json();
  $("statussvar").textContent = res.ok ? (P.status[r.status] || r.status) : r.error;
});
</script>
</main>
</body>
</html>
